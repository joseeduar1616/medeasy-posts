<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Portal MedEasy</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
__CSS__
.login{max-width:400px;width:100%;text-align:left}
.login h1{font-size:30px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:8px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--neon);color:var(--neon-ink)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;background:var(--bg)}
.chk:has(input:checked){border-color:var(--neon);color:var(--neon);background:var(--neon-soft)}
.chk input{accent-color:var(--neon);margin:0}
.tbl.ct td{padding:4px 6px;vertical-align:top} .tbl.ct .in{padding:5px 8px;font-size:13px}
.preco{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.preco > div:first-child{flex:1;min-width:0}
.preco .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;flex:none;max-width:45%}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="gate"><div class="box"><div class="spin"></div></div></div></div></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
if (/\/portal$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search);
const LOGO = "logo.webp";
const CONTATO = { whats:"5562995155830", texto:"(62) 99515-5830", email:"medeasyy0@gmail.com", mentor:"Eduardo" };
const ETAPAS = [
  { t:"Envio dos certificados", c:"Aguardando os seus certificados ou o acesso ao drive", cli:true },
  { t:"Triagem e orçamento", c:"Lendo o edital e conferindo os seus certificados" },
  { t:"Pagamento da entrada", c:"Aguardando a entrada de 50% para começar", cli:true },
  { t:"Em produção", c:"O seu documento está sendo montado" },
  { t:"Conferência", c:"Versão enviada para você conferir e pedir ajustes", cli:true },
  { t:"Ajustes finais", c:"Fazendo as correções que você pediu" },
  { t:"Entregue", c:"Pronto para anexar na inscrição" },
];
const ULT = ETAPAS.length - 1;
const $ = s => document.querySelector(s);
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function num(s){ if (typeof s === "number") return isFinite(s) ? s : 0; s = String(s ?? "").trim().replace(/\s|R\$/g, ""); if (!s) return 0; if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = parseFloat(s); return isFinite(n) ? n : 0; }
const brl = n => "R$ " + (Number(n) || 0).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
const d1 = n => (Number(n) || 0).toLocaleString("pt-BR", { minimumFractionDigits:1, maximumFractionDigits:2 });
function isoLocal(d = new Date()){ const z = d.getTimezoneOffset(); return new Date(d - z * 60000).toISOString().slice(0, 10); }
const hoje = () => isoLocal();
const dBR = iso => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "";
function dias(iso){ if (!iso) return null; const a = new Date(hoje() + "T00:00"), b = new Date(String(iso).slice(0,10) + "T00:00"); const r = Math.round((b - a) / 86400000); return isFinite(r) ? r : null; }
const mesNome = i => ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][i];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function quando(iso){ const d = dias(iso); if (d === null) return ""; if (d === 0) return "hoje"; if (d === 1) return "amanhã"; if (d === -1) return "ontem"; return d > 0 ? `em ${d} dias` : `há ${-d} dias`; }
function dataHora(ts){ if (!ts) return ""; const d = new Date(ts); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} às ${String(d.getHours()).padStart(2,"0")}h${String(d.getMinutes()).padStart(2,"0")}`; }
function primeiro(n){ return String(n || "").trim().split(/\s+/)[0].toLowerCase().replace(/^./, c => c.toUpperCase()); }
function soDigitos(s){ let d = String(s || "").replace(/\D/g, ""); if (d && d.length <= 11) d = "55" + d; return d; }
function waLink(fone, texto){ const d = soDigitos(fone); return `https://wa.me/${d}?text=${encodeURIComponent(texto || "")}`; }
const semAcento = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const codFmt = c => c ? c.slice(0, 5) + "-" + c.slice(5) : "";
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
async function copiar(texto){ try { await navigator.clipboard.writeText(texto); toast("Copiado"); } catch { prompt("Copie:", texto); } }

/* ---------- cripto (mesmo formato de scripts/portal/build.mjs) ---------- */
const enc = new TextEncoder();
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(env, senha){
  const base = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:unb64(env.salt), iterations:env.it, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(env.iv) }, chave, unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const normCodigo = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function arquivoCliente(codigo){ const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("medeasy-c:" + normCodigo(codigo)))); return [...h].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 32); }
const BASE = location.pathname.replace(/[^/]*$/, "");
async function baixar(url){ const r = await fetch(BASE + url + "?t=" + Date.now(), { cache:"no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }

/* ---------- estado ---------- */
const S = { modo:"login", aba:"cliente", erro:"", carregando:false, eq:null, mentor:null, admin:false, portal:null, view:"painel", sel:null, preview:null, busca:"", filtro:"ativos", verMentor:"", cont:{}, ciProva:{}, ciCopiado:null, todosAlertas:false, filtroRep:"receber" };
function guardar(tipo, nome, segredo, admin){ try { sessionStorage.setItem("medeasy", JSON.stringify({ tipo, nome, segredo, admin })); } catch {} }
function sair(){ try { sessionStorage.removeItem("medeasy"); } catch {} Object.assign(S, { modo:"login", eq:null, portal:null, mentor:null, preview:null, sel:null, erro:"", codigo:"", adminDados:null, fb:null, querFeedback:false }); render(); }

async function entrarCliente(codigo){
  codigo = normCodigo(codigo); if (codigo.length < 8){ S.erro = "Confira o código. Ele tem 10 letras e números"; render(); return; }
  S.carregando = true; S.erro = ""; render();
  try { const env = await baixar(`data/c/${await arquivoCliente(codigo)}.json`); S.portal = await abrir(env, codigo); juntarContagemCliente(S.portal); S.portal.orcamento = (S.portal.tipos || []).length ? estimarJS(clienteDoPortal(S.portal)) : null; S.modo = S.querFeedback ? "feedback" : "cliente"; S.codigo = codigo; guardar("cliente", "", codigo); }
  catch { S.erro = "Código não encontrado. Confira com o seu mentor"; }
  S.carregando = false; render();
}
/* Administrador: com o arquivo admin.json no ar, precisa da segunda senha. Sem ela, entra como mentor comum. */
async function confereAdmin(senhaAdmin){ if (!senhaAdmin) return false; try { const env = await baixar("data/admin.json"); S.adminDados = await abrir(env, senhaAdmin.trim()); return true; } catch { return false; } }
async function entrarMentor(nome, senha, senhaAdmin){
  if (!nome.trim() || !senha){ S.erro = "Preencha o nome e a senha"; render(); return; }
  S.carregando = true; S.erro = ""; render();
  try {
    let env; try { env = await baixar("data/equipe.json"); } catch { S.erro = "Não consegui carregar os dados. Confira a internet e tente de novo"; S.carregando = false; render(); return; }
    senha = senha.trim(); let eq; try { eq = await abrir(env, senha); } catch { senha = senha.toLowerCase(); eq = await abrir(env, senha); }
    const n = semAcento(nome); const ms = eq.mentores || []; const m = ms.find(x => semAcento(x.nome) === n) || ms.find(x => semAcento(x.nome).startsWith(n)) || ms.find(x => semAcento(x.nome).split(" ")[0] === n.split(" ")[0]);
    if (!m){ S.erro = "Esse nome não está na lista de mentores"; S.carregando = false; render(); return; }
    let admin = !!m.admin;
    if (admin && eq.senhaAdmin){
      if (senhaAdmin === undefined){ S.pedirAdmin = { nome, senha }; S.carregando = false; render(); return; }
      admin = await confereAdmin(senhaAdmin);
      if (!admin && senhaAdmin){ S.erro = "Senha de administrador incorreta. Deixe em branco para entrar como mentor"; S.carregando = false; render(); return; }
    }
    S.pedirAdmin = null; S.eq = eq; S.mentor = m; S.admin = admin; S.modo = "mentor"; S.senha = senha; S.senhaAdmin = admin ? senhaAdmin : ""; guardar("mentor", nome, senha, admin ? senhaAdmin : "");
    if (S.importar){ const d = lerCodigoTri("?i=" + S.importar); S.importar = null; if (d) importarTri("?i=" + codigoTri(d)); }
    if (S.importarMarc){ const m = S.importarMarc; S.importarMarc = null; importarMarc(m); }
    if (S.importarCerts){ const k = S.importarCerts; S.importarCerts = null; importarCertsDoLink(k); }
    if (typeof pedirSincronizacao === "function") pedirSincronizacao();
    if (typeof juntarTriagemNotion === "function") juntarTriagemNotion();
  } catch { S.erro = "Senha incorreta. Ela é toda em letras minúsculas"; }
  S.carregando = false; render();
}

/* ---------- helpers de dados ---------- */
const papeis = c => [...(c.mentores || []), ...(c.corretores || []), ...(c.trainees || [])];
const alvo = () => S.admin ? S.verMentor : S.mentor.nome;
const meus = () => (S.eq?.clientes || []).filter(c => !alvo() || papeis(c).some(p => semAcento(p) === semAcento(alvo())));
const meusRepasses = c => (c.repasses || []).filter(r => r.pessoa !== "MedEasy" && (!alvo() || semAcento(r.pessoa) === semAcento(alvo())));
// a: liberado e não pago (serviço concluído e cliente quitado). f: futuro (fechado mas ainda não liberado). p: já pago
function somaRep(cs){ const t = { a:0, f:0, p:0, sem:0 }; for (const c of cs) for (const r of meusRepasses(c)){ if (r.valor == null){ t.sem++; continue; } if (r.pago) t.p += num(r.valor); else if (r.liberado) t.a += num(r.valor); else t.f += num(r.valor); } return t; }
function fin(c){ const f = c.financeiro || {}; const total = Math.max(0, num(f.total) - num(f.total) * Math.min(num(f.desconto), 100) / 100); const pago = (f.pagamentos || []).reduce((a, p) => a + num(p.valor), 0) || num(f.pago); return { total, pago, saldo:Math.max(0, total - pago), entradaOk: total > 0 && pago >= total / 2 - 0.009 }; }
const abertos = c => (c.servicos || []).filter(s => (s.etapa || 0) < ULT);
function progresso(c){ const s = c.servicos || []; if (!s.length) return 0; return Math.round(s.reduce((a, x) => a + (x.etapa || 0) / ULT, 0) / s.length * 100); }
function nomeServico(c, s){ if (s.nome) return s.nome; const T = { vitae:"Currículo Vitae/currículo com certificados comprovados", mentoria:"Mentoria mensal", analise:"Análise curricular", lattes:"Currículo Lattes" }; const p = (c.provas || []).find(p => p.id === s.provaId); return (T[s.tipo] || "Serviço") + (s.detalhe ? " " + s.detalhe.replace(/Modelo |Categoria /, "") : "") + (p ? " · " + p.nome : ""); }
function status(c){ const ab = abertos(c); if (!(c.servicos || []).length) return { t:"Novo contato", k:"info" }; if (!ab.length) return { t:"Tudo entregue", k:"ok" }; const m = Math.min(...ab.map(s => s.etapa || 0)); return { t:ETAPAS[m].t, k:ETAPAS[m].cli ? "gold" : "" }; }
function espelho(c){ const f = fin(c); return { id:c.id, nome:c.nome, mentores:c.mentores || [], servicos:(c.servicos || []).map(s => ({ nome:nomeServico(c, s), etapa:s.etapa || 0, prazo:s.prazo || "", mensal:!!s.mensal })), mentoria:c.mentoria || null, provas:provasComContagem(c), pendencias:[...(c.pendencias || []).filter(p => !p.interna), ...pendenciasDoControle(c)], atualizacoes:(c.atualizacoes || []).filter(a => !a.interna), documentos:(c.documentos || []).filter(d => d.link), financeiro:{ ...f }, contato:{ ...(S.eq.contato || CONTATO), mentor:(c.mentores || [])[0] ? c.mentores[0] + " (MedEasy)" : "Equipe MedEasy" }, progresso:progresso(c), atualizadoEm:S.eq.geradoEm, orcamento:estimarJS(c) }; }
function eventos(cs){ const ev = []; for (const c of cs){ for (const p of c.provas || []){ if (p.prazoEnvio) ev.push({ d:p.prazoEnvio, t:`Fim do envio ${p.nome}`, c, k:"gold" }); if (p.dataProva) ev.push({ d:p.dataProva, t:`Prova ${p.nome}`, c, k:"info" }); } for (const s of c.servicos || []) if (s.prazo && (s.etapa || 0) < ULT) ev.push({ d:s.prazo, t:`Entrega ${nomeServico(c, s)}`, c, k:"warn" }); } return ev.sort((a, b) => a.d.localeCompare(b.d)); }
const linkCliente = c => `${location.href.split("#")[0].split("?")[0]}?c=${c.codigo}`;
function convite(c){ return `Oi, ${primeiro(c.nome)}! Tudo bem? Criei o seu acesso no portal da MedEasy. Por lá você acompanha cada etapa do seu currículo, os prazos das provas e o que ainda falta enviar\n\nLink: ${linkCliente(c)}\nSeu código: ${codFmt(c.codigo)}\n\nGuarde esse código, ele é só seu`; }

/* ---------- views ---------- */
const gate = inner => `<div class="wrap"><div class="gate"><div class="box">${inner}</div></div></div>`;
function loginView(){
  const cli = S.aba === "cliente";
  return gate(`<img src="${LOGO}" alt="MedEasy" style="width:110px"><div class="login stack"><h1>Portal MedEasy</h1>
    <div class="seg"><button data-a="aba" data-v="cliente" aria-pressed="${cli}">Sou cliente</button><button data-a="aba" data-v="mentor" aria-pressed="${!cli}">Sou mentor</button></div>
    <form id="fLogin" class="stack" autocomplete="on">
      ${cli ? `<label class="f"><span>Seu código de acesso</span><input class="in mono" id="lCodigo" placeholder="XXXXX-XXXXX" autocomplete="one-time-code" autocapitalize="characters" required></label>`
            : S.pedirAdmin ? `<p class="small" style="margin:0">Olá, ${esc(primeiro(S.pedirAdmin.nome))}. Você é administrador. Digite a senha de administrador, ou deixe em branco para entrar como mentor.</p><label class="f"><span>Senha de administrador</span><input class="in" id="lAdmin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>`
            : `<label class="f"><span>Seu nome</span><input class="in" id="lNome" autocomplete="username" autocorrect="off" spellcheck="false" required></label><label class="f"><span>Senha</span><input class="in" id="lSenha" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>`}
      <div class="err">${esc(S.erro)}</div>
      <button class="btn pri" type="submit" ${S.carregando ? "disabled" : ""}>${S.carregando ? "Abrindo" : "Entrar"}</button>
    </form>
    <p class="xs muted" style="text-align:center">${cli ? "O código chega pelo WhatsApp quando o seu serviço começa." : S.importar ? "Entre para abrir a triagem do cliente no seu painel." : S.importarMarc ? "Entre para importar o que o cliente marcou." : S.importarCerts ? "Entre para colocar a lista de certificados do cliente no controle." : "Acesso da equipe MedEasy."}</p>
    <p class="xs" style="text-align:center;margin:0"><a href="?depoimentos" style="color:var(--muted)">Depoimentos de clientes</a></p></div>`);
}
const ABAS = [["painel","Painel"],["clientes","Clientes"],["triagem","Triagem"],["agenda","Agenda"],["editais","Editais"],["repasses","Repasses"]];
function mentorView(){
  const v = S.view === "cliente" ? "clientes" : S.view === "triagemItem" ? "triagem" : S.view; let body = "";
  if (S.view === "feedbacks" && S.admin && S.adminDados) body = feedbacksView(); else if (S.view === "painel") body = painelView(); else if (S.view === "clientes") body = clientesView(); else if (S.view === "cliente") body = clienteView(); else if (S.view === "triagem") body = triagemView(); else if (S.view === "triagemItem") body = triagemItemView(); else if (S.view === "agenda") body = agendaView(); else if (S.view === "editais") body = editaisView(); else body = repassesView();
  const mentores = (S.eq.mentores || []).map(m => m.nome);
  return `<header class="top"><div class="wrap top-in"><img class="logo" src="${LOGO}" alt=""><div class="brand"><b>MED<i>EASY</i></b><span>${esc(S.mentor.nome)}${S.admin ? " · admin" : ""}</span></div>
    <nav class="tabs">${(S.admin && S.adminDados ? [...ABAS, ["feedbacks","Feedbacks"]] : ABAS).map(([k, t]) => `<button class="tab" data-a="nav" data-v="${k}" ${v === k ? 'aria-current="page"' : ""}>${t}</button>`).join("")}</nav>
    ${S.admin ? `<select class="in" id="verMentor" style="width:auto"><option value="">Toda a equipe</option>${mentores.map(n => `<option ${S.verMentor === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>` : ""}
    <button class="btn sm ghost" data-a="sair">Sair</button></div></header>
    <main class="wrap">${body}<p class="xs faint" style="margin-top:24px">Dados de ${esc(dataHora(S.eq.geradoEm))}. ${typeof temPonte === "function" && temPonte() ? "O que você salvar aqui vai para o Notion na hora, e o site atualiza em 1 ou 2 minutos." : "Para mudar algo, edite no Notion. O portal atualiza sozinho."} Versão do site ${VERSAO_SITE}.</p></main>`;
}
const SEM_PROVA_OK = /trabalho escrito|slides|vitae emprego|formatação/i;
function precisaProva(c){ return !(c.provas || []).length && abertos(c).length && (c.servicos || []).some(s => !SEM_PROVA_OK.test(s.nome)); }
function notionDe(c){ const s = (c.servicos || []).find(s => s.notion && (s.etapa || 0) < 6) || (c.servicos || []).find(s => s.notion); return s ? s.notion : ""; }
function painelView(){
  const cs = meus(); const ab = cs.flatMap(abertos);
  const rep = somaRep(cs);
  const receber = cs.reduce((a, c) => a + fin(c).saldo, 0);
  const al = [];
  for (const c of cs){ for (const s of abertos(c)){ const d = dias(s.prazo); if (d !== null && d < 0) al.push({ k:"bad", c, t:`Entrega atrasada: ${nomeServico(c, s)}`, o:d - 100 }); else if (d !== null && d <= 3) al.push({ k:"warn", c, t:`Entrega ${quando(s.prazo)}: ${nomeServico(c, s)}`, o:d }); }
    for (const p of c.provas || []){ const d = dias(p.prazoEnvio); if (d !== null && d >= 0 && d <= 10 && abertos(c).length) al.push({ k:d <= 3 ? "bad" : "warn", c, t:`Inscrição ${p.nome} fecha ${quando(p.prazoEnvio)}`, o:d - 50 }); }
    { const e = estimarJS(c); if (e && e.completo && abertos(c).length && Math.abs(fin(c).total - e.total) >= 1) al.push({ k:"info", c, t:`Valor no Notion (${brl(fin(c).total)}) diferente do calculado (${brl(e.total)})`, o:45 }); }
    if (precisaProva(c)) al.push({ k:"info", c, t:"Prova não marcada no Notion", o:60 });
    const pa = (c.pendencias || []).filter(p => !p.feita).length; if (pa) al.push({ k:"gold", c, t:`${pa} ${pa > 1 ? "pendências" : "pendência"} com o cliente`, o:40 }); }
  al.sort((a, b) => a.o - b.o);
  const funil = ETAPAS.map((e, i) => cs.flatMap(c => c.servicos || []).filter(s => (s.etapa || 0) === i).length); const fmax = Math.max(1, ...funil);
  return `<div class="pagehead"><div><h1>Olá, ${esc(primeiro(S.mentor.nome))}</h1><p>${cs.length} ${cs.length === 1 ? "cliente" : "clientes"}${S.admin && !S.verMentor ? " na equipe" : ""} e ${ab.length} ${ab.length === 1 ? "serviço" : "serviços"} em andamento</p></div></div>
   <div class="kpis"><div class="kpi hl"><div class="label">Em andamento</div><div class="v">${ab.length}</div><div class="d">${funil[4]} em conferência</div></div>
     <div class="kpi clickable" data-a="nav" data-v="repasses"><div class="label">${S.admin && !S.verMentor ? "Repasses a pagar" : S.admin ? esc(S.verMentor) + " vai receber" : "Você vai receber"}</div><div class="v gold">${brl(rep.a)}</div><div class="d">serviços concluídos e quitados${rep.sem ? ` · ${rep.sem} sem valor` : ""}</div></div>
     <div class="kpi clickable" data-a="nav" data-v="repasses"><div class="label">Valores futuros</div><div class="v">${brl(rep.f)}</div><div class="d">fechados, falta concluir ou o cliente quitar · já recebido ${brl(rep.p)}</div></div>

  const sy = window.scrollY;
  if (S.modo === "login") app.innerHTML = loginView();
  else if (S.modo === "triagem") app.innerHTML = triagemFormView();
  else if (S.modo === "feedback") app.innerHTML = feedbackView();
  else if (S.modo === "depoimentos") app.innerHTML = depoimentosView();
  else if (S.modo === "cliente") app.innerHTML = portalView(S.portal, false);
  else if (S.preview) app.innerHTML = portalView(espelho(S.eq.clientes.find(c => c.id === S.preview)), true);
  else app.innerHTML = mentorView();
  if (S.modo !== "login") window.scrollTo(0, sy);
  const f = $("#fLogin"); if (f){ f.onsubmit = e => { e.preventDefault(); if (S.aba === "cliente") entrarCliente($("#lCodigo").value); else if (S.pedirAdmin) entrarMentor(S.pedirAdmin.nome, S.pedirAdmin.senha, $("#lAdmin").value || ""); else entrarMentor($("#lNome").value, $("#lSenha").value); }; const first = f.querySelector("input"); if (first && !S.carregando) first.focus(); }
  const b = $("#busca"); if (b){ b.oninput = () => { S.busca = b.value; const pos = b.selectionStart; render(); const nb = $("#busca"); nb.focus(); nb.setSelectionRange(pos, pos); }; }
  const vm = $("#verMentor"); if (vm) vm.onchange = () => { S.verMentor = vm.value; render(); };
  const ft = $("#fTri"); if (ft) ft.onsubmit = e => { e.preventDefault(); enviarTriagem(); };
  const fc = $("#fFbCod"); if (fc) fc.onsubmit = e => { e.preventDefault(); entrarCliente($("#fbCodigo").value); };
  const cf = $("#ctFiltro"); if (cf) cf.onchange = () => { (S.ctFiltro ||= {})[S.sel] = cf.value; render(); };
  const te = $("#triEtapa"); if (te) te.onchange = () => { const t = triDe(S.sel); if (t){ t.etapa = te.value; salvarTri(t); render(); } };
  const be = $("#buscaEd"); if (be){ be.oninput = () => { S.buscaEd = be.value; const pos = be.selectionStart; render(); const nb = $("#buscaEd"); nb.focus(); nb.setSelectionRange(pos, pos); }; }
}

/* Versão nova do site: quem deixa a aba aberta continuava com o código antigo depois de uma correção.
   O montar-site grava a versão em site.txt. Ao voltar para a aba (e a cada 5 minutos) o site confere e oferece atualizar. */
const VERSAO_SITE = "__VERSAO__";
/* Erro no site aparece na tela (com a versão), em vez de falhar calado. Ajuda a mandar print para o suporte. */
window.addEventListener("error", e => { try { toast(`Erro no site: ${e.message} (versão ${VERSAO_SITE})`); } catch {} });
window.addEventListener("unhandledrejection", e => { try { toast(`Erro no site: ${(e.reason && e.reason.message) || e.reason} (versão ${VERSAO_SITE})`); } catch {} });
async function conferirVersao(){
  if (document.getElementById("novaVersao")) return;
  try { const r = await fetch("site.txt?t=" + Date.now(), { cache:"no-store" }); if (!r.ok) return; const v = (await r.text()).trim();
    if (!v || v === VERSAO_SITE) return;
    const d = document.createElement("div"); d.id = "novaVersao"; d.className = "nova-versao";
    d.innerHTML = `<span>Saiu uma versão nova do site.</span><button class="btn sm pri" type="button">Atualizar agora</button>`;
    d.querySelector("button").onclick = () => location.reload(); document.body.appendChild(d); } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) conferirVersao(); });
setInterval(conferirVersao, 5 * 60 * 1000);
(async () => {
  let s = null; try { s = JSON.parse(sessionStorage.getItem("medeasy")); } catch {}
  const cod = new URLSearchParams(location.search).get("c");
  const tri = new URLSearchParams(location.search).get("triagem");
  if (tri !== null){ S.modo = "triagem"; S.triDestino = soDigitos(tri); render(); return; }
  // Depoimentos aprovados: página pública
  if (new URLSearchParams(location.search).has("depoimentos")){ S.modo = "depoimentos"; render(); carregarDepoimentos(); return; }
  // Página de feedback do cliente: ?feedback (pede o código) ou ?c=CODIGO&feedback (link do mentor)
  if (new URLSearchParams(location.search).has("feedback")){ S.querFeedback = true;
    if (cod) { await entrarCliente(cod); if (S.modo !== "feedback") { S.modo = "feedback"; render(); } return; }
    if (s && s.tipo === "cliente") { await entrarCliente(s.segredo); if (S.modo === "feedback") return; }
    S.modo = "feedback"; S.erro = ""; render(); return; }
  // Link "Abrir no painel" da mensagem de triagem: importa depois que o mentor entrar
  const imp = new URLSearchParams(location.search).get("i");
  if (imp){ S.importar = imp; S.aba = "mentor"; history.replaceState(null, "", location.pathname); }
  // Link "Abrir no painel" da marcação do cliente
  const marc = new URLSearchParams(location.search).get("m");
  if (marc){ S.importarMarc = marc; S.aba = "mentor"; history.replaceState(null, "", location.pathname); }
  // Link da lista de certificados que o cliente montou no portal
  const certs = new URLSearchParams(location.search).get("k");
  if (certs){ S.importarCerts = certs; S.aba = "mentor"; history.replaceState(null, "", location.pathname); }
  if (s && s.tipo === "mentor") await entrarMentor(s.nome, s.segredo, s.admin || "");
  else if (s && s.tipo === "cliente") await entrarCliente(s.segredo);
  else if (cod){ S.aba = "cliente"; await entrarCliente(cod); }
  else render();
  if (S.modo === "login") S.erro = "", render();
})();
