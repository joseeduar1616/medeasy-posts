name: Portal MedEasy - ponte (Cloudflare Worker)

# Verifica qual versão da ponte está no ar e, se houver o secret CLOUDFLARE_API_TOKEN,
# publica a pasta worker/ no Cloudflare. Os secrets do Worker (senhas e tokens) ficam no Cloudflare e não mudam.
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portal-ponte
  cancel-in-progress: false

jobs:
  ponte:
    runs-on: ubuntu-latest
    env:
      PONTE: https://medeasy-ponte.medeasy.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Sem o secret CLOUDFLARE_API_TOKEN. Pulei a publicação, só vou verificar a versão no ar."; exit 0
          fi
          cd worker && npx --yes wrangler@4 deploy

      - name: Guardar a chave do Gemini na ponte
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$GEMINI_API_KEY" ]; then echo "Sem o secret GEMINI_API_KEY no GitHub. Nada a fazer."; exit 0; fi
          cd worker && printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY

      - name: Testar o Gemini pela ponte
        env:
          SENHA: ${{ secrets.PORTAL_SENHA }}
        run: |
          sleep 20
          curl -s "$PONTE/saude"; echo
          case "$(curl -s "$PONTE/saude")" in *'"gemini":true'*) ;; *) echo "A ponte ainda não tem a chave do Gemini."; exit 0 ;; esac
          for s in "$SENHA" "$(printf '%s' "$SENHA" | tr '[:upper:]' '[:lower:]')"; do
            r=$(curl -s -X POST "$PONTE/gemini/gerar" -H "Authorization: Bearer $s" -H "Content-Type: application/json" -d '{"texto":"Responda só com a palavra funcionando.","rapido":true}')
            case "$r" in *"senha da equipe"*) continue ;; esac
            echo "Resposta do Gemini: $(printf '%s' "$r" | head -c 400)"
            case "$r" in *'"texto"'*) echo "Gemini funcionando." ;; *) echo "::warning::O Gemini não respondeu. Confira a chave e a cobrança no Google AI Studio." ;; esac
            exit 0
          done

      - name: Verificar a versão no ar
        env:
          SENHA: ${{ secrets.PORTAL_SENHA }}
        run: |
          curl -s "$PONTE/saude"; echo
          # Página que não existe: a versão nova responde com erro do Notion, a antiga com "rota desconhecida". Não grava nada.
          for s in "$SENHA" "$(printf '%s' "$SENHA" | tr '[:upper:]' '[:lower:]')"; do
            r=$(curl -s -X POST "$PONTE/triagem" -H "Authorization: Bearer $s" -H "Content-Type: application/json" -d '{"id":"00000000000000000000000000000000","props":{}}')
            case "$r" in *"senha da equipe"*) continue ;; esac
            echo "Resposta: $r"
            case "$r" in
              *"rota desconhecida"*) echo "::warning::Ponte ANTIGA no ar. Falta publicar a versão nova."; exit 0 ;;
              *) echo "Ponte NOVA no ar (rotas /triagem e /cliente funcionando)."; exit 0 ;;
            esac
          done
          echo "::warning::Não consegui entrar na ponte com a senha da equipe do GitHub."
