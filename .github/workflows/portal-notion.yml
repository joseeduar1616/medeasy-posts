name: Portal MedEasy - sincronizar com o Notion

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: portal-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Uma rodada travada segurava todas as outras (o apt-get ficou parado mais de 1 hora). Com o limite, ela cai e a próxima roda.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar leitor de PDF
        timeout-minutes: 4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Gerar dados criptografados
        env:
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          PORTAL_SENHA_ADMIN: ${{ secrets.PORTAL_SENHA_ADMIN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DB" ] || [ -z "$PORTAL_SENHA" ]; then
            echo "Segredos do Notion ainda não configurados. Nada a fazer."; exit 0
          fi
          node scripts/portal/build.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "medeasy-bot"
          git config user.email "medeasy-bot@users.noreply.github.com"
          # Duas rodadas seguidas davam conflito no equipe.json e a segunda não publicava nada (o site ficava com os dados velhos).
          # Os dados são gerados inteiros a cada rodada, então esta rodada vai por cima do main mais novo, mexendo só em portal/data.
          for i in 1 2 3 4; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q FETCH_HEAD
            git add portal/data
            if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
            git commit -q -m "Portal: dados atualizados do Notion"
            if git push -q origin HEAD:"$GITHUB_REF_NAME"; then echo "Publicado"; exit 0; fi
            echo "Outra rodada publicou antes. Tentando de novo"; sleep $((i * 5))
          done
          exit 1
