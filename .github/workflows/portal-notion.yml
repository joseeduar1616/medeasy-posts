name: Portal MedEasy - sincronizar com o Notion

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: portal-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar leitor de PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Gerar dados criptografados
        env:
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DB" ] || [ -z "$PORTAL_SENHA" ]; then
            echo "Segredos do Notion ainda não configurados. Nada a fazer."; exit 0
          fi
          node scripts/portal/build.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "medeasy-bot"
          git config user.email "medeasy-bot@users.noreply.github.com"
          git add portal/data
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Portal: dados atualizados do Notion"
          git pull --rebase -q origin main || true
          git push
