name: Portal MedEasy - publicar site

on:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal-pages.yml"]
  workflow_run:
    workflows: ["Portal MedEasy - sincronizar com o Notion"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (portal na raiz, /portal/ continua valendo para os links antigos)
        run: |
          mkdir -p _site/portal
          cp -r portal/. _site/
          rm -f _site/README.md
          printf '<!doctype html><meta charset="utf-8"><title>Portal MedEasy</title><script>location.replace("../"+location.search+location.hash)</script><meta http-equiv="refresh" content="0; url=../">' > _site/portal/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Confere se o domínio já entrega a versão nova (site.txt) e mostra como ele manda guardar a página.
      # Se a versão no ar demorar a mudar, o cache está no caminho (navegador ou Cloudflare).
      - name: Conferir o site no ar
        run: |
          esperado=$(cat portal/site.txt)
          for i in 1 2 3 4 5 6; do
            noar=$(curl -s "https://curriculosmedeasy.com.br/site.txt?t=$(date +%s)" | tr -d '\n')
            echo "esperado $esperado, no ar $noar"
            [ "$noar" = "$esperado" ] && break
            sleep 20
          done
          echo "--- cabeçalhos da página"
          curl -sI https://curriculosmedeasy.com.br/ | grep -iE "cache-control|age:|cf-cache-status|server|expires|last-modified|etag" || true
          echo "--- versão dentro do index.html"
          curl -s https://curriculosmedeasy.com.br/ | grep -o 'VERSAO_SITE = "[^"]*"' || echo "index sem VERSAO_SITE (versão antiga)"
