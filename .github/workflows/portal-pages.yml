name: Portal MedEasy - publicar site

on:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal-pages.yml"]
  workflow_run:
    workflows: ["Portal MedEasy - sincronizar com o Notion"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só a pasta portal)
        run: mkdir -p _site && cp -r portal _site/portal && printf '<!doctype html><meta http-equiv="refresh" content="0; url=portal/">' > _site/index.html && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
