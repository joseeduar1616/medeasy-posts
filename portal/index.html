<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Portal MedEasy</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: barra fixa com abas, conteúdo em grade de cartões; o portal do cliente é uma coluna única de leitura.
   Marca MedEasy: noite verde-escura, verde neon da logo e o dourado da lâmpada. Tema escuro único, por escolha da marca. */
:root{
  --bg:#0A0F0C; --surface:#111914; --surface2:#17221B; --line:#243129; --line2:#2F3F35;
  --fg:#E8F0EA; --muted:#8EA196; --faint:#5E7066;
  --neon:#3DFF6E; --neon-ink:#06210F; --neon-soft:rgba(61,255,110,.12);
  --gold:#F0BE4E; --gold-soft:rgba(240,190,78,.13);
  --warn:#FFA94D; --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.12); --info:#7CC4FF;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px; --r-sm:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--neon)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .gold{color:var(--gold)} .neon{color:var(--neon)}
.small{font-size:13px} .xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{width:34px;height:auto;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--neon)}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;margin-left:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.tab:hover{color:var(--fg);background:var(--surface2)}
.tab[aria-current="page"]{background:var(--neon);color:var(--neon-ink)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--neon)}
.sync[data-s="salvando"]::before{background:var(--gold)}
.sync[data-s="erro"]::before{background:var(--bad)}
@media (max-width:720px){.top-in{flex-wrap:wrap}.tabs{order:3;flex-basis:100%;margin-left:0}.sync{margin-left:auto}}

main{padding-block:22px 60px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:clamp(24px,3.4vw,32px);font-weight:800}
.pagehead p{margin:4px 0 0;color:var(--muted)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-size:18px;font-weight:700}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:13px;color:var(--muted)}
.sec{scroll-margin-top:90px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{border-color:color-mix(in srgb,var(--neon) 45%,var(--line));background:linear-gradient(160deg,var(--neon-soft),var(--surface) 60%)}
.kpi.hl .v{color:var(--neon)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--neon);border-color:var(--neon);color:var(--neon-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241800}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.on{background:var(--bad);color:#2a0606}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:5px 9px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}

/* Fields */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12px;color:var(--muted);font-weight:600}
.in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.in:focus{border-color:var(--neon);outline:none;box-shadow:0 0 0 3px var(--neon-soft)}
textarea.in{resize:vertical;min-height:80px;line-height:1.45}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.chk input{accent-color:var(--neon);width:16px;height:16px}
.search{max-width:320px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--neon);border-color:color-mix(in srgb,var(--neon) 40%,transparent);background:var(--neon-soft)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}
.dot.ok{background:var(--neon)} .dot.gold{background:var(--gold)} .dot.bad{background:var(--bad)}

/* Progress */
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--neon);border-radius:99px}
.bar.gold > i{background:var(--gold)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.clickable{cursor:pointer;border-radius:8px}
.clickable:hover .t{color:var(--neon)}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--line2);flex:none}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.gold{background:var(--gold)} .sev.ok{background:var(--neon)} .sev.info{background:var(--info)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}

/* Client rows */
.crow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer}
.crow:hover{background:var(--surface2)}
.crow:first-child{border-top:0}
.crow .t{font-weight:700}
@media (max-width:820px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .hide-m{display:none}}

/* Stepper */
.steps{display:flex;gap:4px;margin-top:10px}
.steps button{flex:1;height:8px;border-radius:99px;border:0;background:var(--line2);cursor:pointer;padding:0}
.steps button.done{background:color-mix(in srgb,var(--neon) 55%,var(--line2))}
.steps button.cur{background:var(--neon);box-shadow:0 0 10px var(--neon-soft)}
.steps.ro button{cursor:default}
.svc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}

/* Kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;font-weight:700;font-size:13px}
.kcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.kcard .t{font-weight:700;cursor:pointer}
.kcard .t:hover{color:var(--neon)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl .in{padding:6px 8px}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{fill:color-mix(in srgb,var(--neon) 70%,var(--surface))}
.chart .b.now{fill:var(--neon)}
.chart .vl{fill:var(--fg);font-weight:600}

.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .fr{display:grid;grid-template-columns:150px 1fr 32px;gap:10px;align-items:center;font-size:13px}
@media (max-width:480px){.funnel .fr{grid-template-columns:110px 1fr 28px}}

/* Orçamento preview, inspired by the printed budget */
.paper{background:#FFF9F5;color:#1d1d1d;border-radius:10px;padding:20px;font-size:13px}
.paper h3{font-family:var(--f-body);font-weight:800;font-size:16px;color:#111}
.paper .ps{color:#004172;font-weight:700;font-size:12px;margin-top:2px}
.paper table{width:100%;border-collapse:collapse;margin-top:12px}
.paper th{background:#004172;color:#fff;font-size:11px;padding:7px;text-align:left}
.paper td{border-bottom:1px solid #e5d9d0;padding:7px;vertical-align:top}
.paper .tot{text-align:right;font-weight:800;font-size:15px;margin-top:10px;color:#111}
.paper .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:2px solid #004172;padding-bottom:6px;margin-top:10px;color:#004172;font-weight:700;font-size:12px}
.opt-tabs{display:flex;gap:6px;flex-wrap:wrap}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

/* Waiting banner */
.wait{border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}

/* ---------- Portal do cliente ---------- */
.portal{max-width:760px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,rgba(240,190,78,.16),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(61,255,110,.12),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:clamp(26px,5vw,36px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted)}
.ring{width:118px;height:118px;flex:none}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--fg)}
@media (max-width:520px){.hero{grid-template-columns:1fr}.ring{width:96px;height:96px}}
.pstep{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:12px}
.pstep:last-child{padding-bottom:0}
.pstep::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.pstep:last-child::before{display:none}
.pstep .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:800;position:relative;z-index:1}
.pstep.done .b{background:var(--neon);border-color:var(--neon);color:var(--neon-ink)}
.pstep.cur .b{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.pstep.cur .b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pstep .tt{font-weight:600;font-size:14px}
.pstep.todo .tt{color:var(--faint)}
.score{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:16px;color:var(--muted);font-weight:600}
.itbar{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.itbar:first-child{border-top:0}
.itbar .bar{margin-top:5px}
.countdown{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line2)}
.countdown b{font-family:var(--f-display);font-size:22px;line-height:1}
.countdown span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0}
.tl-i{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl-i:first-child{border-top:0}
.pend{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.pend + .pend{margin-top:8px}
.pend.feita{background:none;border-color:var(--line);color:var(--muted);text-decoration:line-through}
details.faq{border-top:1px solid var(--line);padding:10px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:8px 0 0;color:var(--muted)}
.preview-bar{background:var(--gold);color:#241800;font-weight:700}
.preview-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}

/* Gate screens */
.gate{min-height:80vh;display:grid;place-items:center;text-align:center}
.gate .box{max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px}
.gate img{width:120px}
.code{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px dashed var(--line2);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--neon);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
.hr{height:1px;background:var(--line);margin:14px 0}
.drop{position:relative}
.drop-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;z-index:4;overflow:hidden}
.drop-list button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer}
.drop-list button:hover{background:var(--line)}
.drop-list img{width:24px;height:24px;border-radius:50%}
.av{width:28px;height:28px;border-radius:50%;flex:none}

.login{max-width:400px;width:100%;text-align:left}
.login h1{font-size:30px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:8px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--neon);color:var(--neon-ink)}
.err{color:var(--bad);font-size:14px;min-height:20px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="gate"><div class="box"><div class="spin"></div></div></div></div></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
if (/\/portal$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search);
const LOGO = "logo.webp";
const CONTATO = { whats:"5562991373642", texto:"(62) 99137-3642", email:"medeasyy0@gmail.com", mentor:"José Eduardo" };
const ETAPAS = [
  { t:"Envio dos certificados", c:"Aguardando os seus certificados ou o acesso ao drive", cli:true },
  { t:"Triagem e orçamento", c:"Lendo o edital e conferindo os seus certificados" },
  { t:"Pagamento da entrada", c:"Aguardando a entrada de 50% para começar", cli:true },
  { t:"Em produção", c:"O seu documento está sendo montado" },
  { t:"Conferência", c:"Versão enviada para você conferir e pedir ajustes", cli:true },
  { t:"Ajustes finais", c:"Fazendo as correções que você pediu" },
  { t:"Entregue", c:"Pronto para anexar na inscrição" },
];
const ULT = ETAPAS.length - 1;
const $ = s => document.querySelector(s);
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function num(s){ if (typeof s === "number") return isFinite(s) ? s : 0; s = String(s ?? "").trim().replace(/\s|R\$/g, ""); if (!s) return 0; if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = parseFloat(s); return isFinite(n) ? n : 0; }
const brl = n => "R$ " + (Number(n) || 0).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
const d1 = n => (Number(n) || 0).toLocaleString("pt-BR", { minimumFractionDigits:1, maximumFractionDigits:2 });
function isoLocal(d = new Date()){ const z = d.getTimezoneOffset(); return new Date(d - z * 60000).toISOString().slice(0, 10); }
const hoje = () => isoLocal();
const dBR = iso => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "";
function dias(iso){ if (!iso) return null; const a = new Date(hoje() + "T00:00"), b = new Date(String(iso).slice(0,10) + "T00:00"); const r = Math.round((b - a) / 86400000); return isFinite(r) ? r : null; }
const mesNome = i => ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][i];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function quando(iso){ const d = dias(iso); if (d === null) return ""; if (d === 0) return "hoje"; if (d === 1) return "amanhã"; if (d === -1) return "ontem"; return d > 0 ? `em ${d} dias` : `há ${-d} dias`; }
function dataHora(ts){ if (!ts) return ""; const d = new Date(ts); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} às ${String(d.getHours()).padStart(2,"0")}h${String(d.getMinutes()).padStart(2,"0")}`; }
function primeiro(n){ return String(n || "").trim().split(/\s+/)[0].toLowerCase().replace(/^./, c => c.toUpperCase()); }
function soDigitos(s){ let d = String(s || "").replace(/\D/g, ""); if (d && d.length <= 11) d = "55" + d; return d; }
function waLink(fone, texto){ const d = soDigitos(fone); return `https://wa.me/${d}?text=${encodeURIComponent(texto || "")}`; }
const semAcento = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const codFmt = c => c ? c.slice(0, 5) + "-" + c.slice(5) : "";
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
async function copiar(texto){ try { await navigator.clipboard.writeText(texto); toast("Copiado"); } catch { prompt("Copie:", texto); } }

/* ---------- cripto (mesmo formato de scripts/portal/build.mjs) ---------- */
const enc = new TextEncoder();
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(env, senha){
  const base = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:unb64(env.salt), iterations:env.it, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(env.iv) }, chave, unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const normCodigo = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function arquivoCliente(codigo){ const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("medeasy-c:" + normCodigo(codigo)))); return [...h].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 32); }
const BASE = location.pathname.replace(/[^/]*$/, "");
async function baixar(url){ const r = await fetch(BASE + url + "?t=" + Date.now(), { cache:"no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }

/* ---------- estado ---------- */
const S = { modo:"login", aba:"cliente", erro:"", carregando:false, eq:null, mentor:null, admin:false, portal:null, view:"painel", sel:null, preview:null, busca:"", filtro:"ativos", verMentor:"" };
function guardar(tipo, nome, segredo){ try { sessionStorage.setItem("medeasy", JSON.stringify({ tipo, nome, segredo })); } catch {} }
function sair(){ try { sessionStorage.removeItem("medeasy"); } catch {} Object.assign(S, { modo:"login", eq:null, portal:null, mentor:null, preview:null, sel:null, erro:"" }); render(); }

async function entrarCliente(codigo){
  codigo = normCodigo(codigo); if (codigo.length < 8){ S.erro = "Confira o código. Ele tem 10 letras e números"; render(); return; }
  S.carregando = true; S.erro = ""; render();
  try { const env = await baixar(`data/c/${await arquivoCliente(codigo)}.json`); S.portal = await abrir(env, codigo); S.modo = "cliente"; guardar("cliente", "", codigo); }
  catch { S.erro = "Código não encontrado. Confira com o seu mentor"; }
  S.carregando = false; render();
}
async function entrarMentor(nome, senha){
  if (!nome.trim() || !senha){ S.erro = "Preencha o nome e a senha"; render(); return; }
  S.carregando = true; S.erro = ""; render();
  try {
    let env; try { env = await baixar("data/equipe.json"); } catch { S.erro = "Não consegui carregar os dados. Confira a internet e tente de novo"; S.carregando = false; render(); return; }
    senha = senha.trim(); let eq; try { eq = await abrir(env, senha); } catch { senha = senha.toLowerCase(); eq = await abrir(env, senha); }
    const n = semAcento(nome); const ms = eq.mentores || []; const m = ms.find(x => semAcento(x.nome) === n) || ms.find(x => semAcento(x.nome).startsWith(n)) || ms.find(x => semAcento(x.nome).split(" ")[0] === n.split(" ")[0]);
    if (!m){ S.erro = "Esse nome não está na lista de mentores"; S.carregando = false; render(); return; }
    S.eq = eq; S.mentor = m; S.admin = !!m.admin; S.modo = "mentor"; guardar("mentor", nome, senha);
  } catch { S.erro = "Senha incorreta. Ela é toda em letras minúsculas"; }
  S.carregando = false; render();
}

/* ---------- helpers de dados ---------- */
const papeis = c => [...(c.mentores || []), ...(c.corretores || []), ...(c.trainees || [])];
const alvo = () => S.admin ? S.verMentor : S.mentor.nome;
const meus = () => (S.eq?.clientes || []).filter(c => !alvo() || papeis(c).some(p => semAcento(p) === semAcento(alvo())));
const meusRepasses = c => (c.repasses || []).filter(r => r.pessoa !== "MedEasy" && (!alvo() || semAcento(r.pessoa) === semAcento(alvo())));
function somaRep(cs){ const t = { a:0, p:0, sem:0 }; for (const c of cs) for (const r of meusRepasses(c)){ if (r.valor == null){ t.sem++; continue; } if (r.pago) t.p += num(r.valor); else t.a += num(r.valor); } return t; }
function fin(c){ const f = c.financeiro || {}; const total = Math.max(0, num(f.total) - num(f.total) * Math.min(num(f.desconto), 100) / 100); const pago = (f.pagamentos || []).reduce((a, p) => a + num(p.valor), 0) || num(f.pago); return { total, pago, saldo:Math.max(0, total - pago), entradaOk: total > 0 && pago >= total / 2 - 0.009 }; }
const abertos = c => (c.servicos || []).filter(s => (s.etapa || 0) < ULT);
function progresso(c){ const s = c.servicos || []; if (!s.length) return 0; return Math.round(s.reduce((a, x) => a + (x.etapa || 0) / ULT, 0) / s.length * 100); }
function nomeServico(c, s){ if (s.nome) return s.nome; const T = { vitae:"Currículo Vitae", analise:"Análise curricular", lattes:"Currículo Lattes" }; const p = (c.provas || []).find(p => p.id === s.provaId); return (T[s.tipo] || "Serviço") + (s.detalhe ? " " + s.detalhe.replace(/Modelo |Categoria /, "") : "") + (p ? " · " + p.nome : ""); }
function status(c){ const ab = abertos(c); if (!(c.servicos || []).length) return { t:"Novo contato", k:"info" }; if (!ab.length) return { t:"Tudo entregue", k:"ok" }; const m = Math.min(...ab.map(s => s.etapa || 0)); return { t:ETAPAS[m].t, k:ETAPAS[m].cli ? "gold" : "" }; }
function espelho(c){ const f = fin(c); return { nome:c.nome, servicos:(c.servicos || []).map(s => ({ nome:nomeServico(c, s), etapa:s.etapa || 0, prazo:s.prazo || "" })), provas:c.provas || [], pendencias:(c.pendencias || []).filter(p => !p.interna), atualizacoes:(c.atualizacoes || []).filter(a => !a.interna), documentos:(c.documentos || []).filter(d => d.link), financeiro:{ ...f }, contato:{ ...(S.eq.contato || CONTATO), mentor:(c.mentores || [])[0] ? c.mentores[0] + " (MedEasy)" : "Equipe MedEasy" }, progresso:progresso(c), atualizadoEm:S.eq.geradoEm }; }
function eventos(cs){ const ev = []; for (const c of cs){ for (const p of c.provas || []){ if (p.prazoEnvio) ev.push({ d:p.prazoEnvio, t:`Fim do envio ${p.nome}`, c, k:"gold" }); if (p.dataProva) ev.push({ d:p.dataProva, t:`Prova ${p.nome}`, c, k:"info" }); } for (const s of c.servicos || []) if (s.prazo && (s.etapa || 0) < ULT) ev.push({ d:s.prazo, t:`Entrega ${nomeServico(c, s)}`, c, k:"warn" }); } return ev.sort((a, b) => a.d.localeCompare(b.d)); }
function convite(c){ const link = location.href.split("#")[0].split("?")[0]; return `Oi, ${primeiro(c.nome)}! Tudo bem? Criei o seu acesso no portal da MedEasy. Por lá você acompanha cada etapa do seu currículo, os prazos das provas e o que ainda falta enviar\n\nLink: ${link}?c=${c.codigo}\nSeu código: ${codFmt(c.codigo)}\n\nGuarde esse código, ele é só seu`; }

function agendaView(){
  const ev = eventos(meus()).filter(e => dias(e.d) >= -1); const g = {}; ev.forEach(e => (g[e.d.slice(0, 7)] ||= []).push(e));
  return `<div class="pagehead"><div><h1>Agenda</h1><p>Prazos de inscrição, provas e entregas</p></div></div>${Object.keys(g).length ? `<div class="grid2">${Object.entries(g).map(([k, es]) => `<section class="card"><div class="card-h"><h2>${MESES[+k.slice(5, 7) - 1]} de ${k.slice(0, 4)}</h2></div><div class="list">${es.map(e => `<div class="li clickable" data-a="abrir" data-id="${e.c.id}"><span class="sev ${e.k}"></span><div class="countdown"><b class="num">${e.d.slice(8, 10)}</b><span>${mesNome(+e.d.slice(5, 7) - 1)}</span></div><div class="grow"><div class="t">${esc(e.t)}</div><div class="small muted">${esc(e.c.nome)} · ${quando(e.d)}</div></div></div>`).join("")}</div></section>`).join("")}</div>` : `<div class="empty">Sem datas</div>`}`;
}
function repassesView(){
  const linhas = []; for (const c of meus()) for (const r of meusRepasses(c)) linhas.push({ c, r, s:(c.servicos || []).find(s => s.id === r.servico) });
  linhas.sort((a, b) => (a.r.pago - b.r.pago) || a.c.nome.localeCompare(b.c.nome));
  const porPessoa = {}; for (const { r } of linhas){ const p = (porPessoa[r.pessoa] ||= { a:0, p:0, sem:0, n:0 }); p.n++; if (r.valor == null) p.sem++; else if (r.pago) p.p += num(r.valor); else p.a += num(r.valor); }
  const geral = S.admin && !S.verMentor;
  return `<div class="pagehead"><div><h1>Repasses</h1><p>${geral ? "Quanto cada pessoa da equipe vai receber" : "O que você vai receber, como mentor e como corretor"}</p></div></div>
   ${S.eq.valoresPendentes ? `<div class="wait small">Os valores são calculados pelas fórmulas do Notion. Eles aparecem aqui assim que a sincronização automática estiver ligada no GitHub.</div>` : ""}
   <div class="kpis">${Object.entries(porPessoa).sort((a, b) => b[1].a - a[1].a).map(([m, r]) => `<div class="kpi"><div class="label">${esc(m)}</div><div class="v gold">${brl(r.a)}</div><div class="d">a receber · ${brl(r.p)} pago${r.sem ? ` · ${r.sem} sem valor` : ""}</div></div>`).join("")}</div>
   <section class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Cliente</th>${geral ? "<th>Pessoa</th>" : ""}<th>Papel</th><th>Serviço</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>
   ${linhas.map(({ c, r, s }) => `<tr class="clickable" data-a="abrir" data-id="${c.id}"><td><b>${esc(c.nome)}</b></td>${geral ? `<td>${esc(r.pessoa)}</td>` : ""}<td>${esc(r.papel)}</td><td class="small">${esc(s ? s.status : "")}</td><td class="r num">${r.valor == null ? "–" : brl(r.valor)}</td><td>${r.pago ? `<span class="pill ok">Pago${r.data ? " " + dBR(r.data) : ""}</span>` : `<span class="pill gold">A receber</span>`}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">Nenhum repasse</td></tr>`}</tbody></table></div></section>`;
}
function anel(p){ const r = 46, c = 2 * Math.PI * r; return `<svg class="ring" viewBox="0 0 110 110" role="img" aria-label="${p}% concluído"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--neon)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" transform="rotate(-90 55 55)"/><text x="55" y="58" text-anchor="middle" font-size="24">${p}%</text><text x="55" y="76" text-anchor="middle" font-size="9" fill="var(--muted)" style="fill:var(--muted);font-family:var(--f-body);font-weight:600;letter-spacing:.08em">CONCLUÍDO</text></svg>`; }
function portalView(p, preview){
  const ct = p.contato || CONTATO; const nome = primeiro(p.nome);
  const pend = (p.pendencias || []).filter(x => !x.feita); const feitas = (p.pendencias || []).filter(x => x.feita);
  const prazos = [];
  (p.provas || []).forEach(x => { if (x.prazoEnvio) prazos.push({ d:x.prazoEnvio, t:`Fim do envio do currículo ${x.nome}` }); if (x.dataProva) prazos.push({ d:x.dataProva, t:`Prova ${x.nome}` }); });
  (p.servicos || []).forEach(s => { if (s.prazo && s.etapa < ULT) prazos.push({ d:s.prazo, t:`Entrega prevista: ${s.nome}` }); });
  prazos.sort((a, b) => a.d.localeCompare(b.d)); const futuros = prazos.filter(x => dias(x.d) >= 0);
  const f = p.financeiro || {};
  const svcAtual = (p.servicos || []).filter(s => s.etapa < ULT).sort((a, b) => a.etapa - b.etapa)[0];
  const subt = !p.servicos?.length ? "Assim que o seu serviço começar, cada etapa aparece aqui" : svcAtual ? ETAPAS[svcAtual.etapa].c : "Tudo pronto. Agora é anexar na inscrição e focar na prova";
  const waTxt = `Oi, ${ct.mentor.split(" ")[0]}! Aqui é ${p.nome || ""}. `;
  return `${preview ? `<div class="preview-bar"><div class="wrap"><span>Prévia do que ${esc(nome)} vê</span><button class="btn sm" data-a="sairPreview">Voltar ao painel</button></div></div>` : ""}
  <header class="top"><div class="wrap top-in"><img class="logo" src="${LOGO}" alt=""><div class="brand"><b>MED<i>EASY</i></b><span>Seu currículo para a residência</span></div><span style="flex:1"></span>${preview ? "" : `<button class="btn sm ghost" data-a="sair">Sair</button>`}<a class="btn sm" target="_blank" rel="noopener" href="${waLink(ct.whats, waTxt)}">Falar com o mentor</a></div></header>
  <main class="wrap portal stack" style="gap:16px">
    <section class="hero"><div><div class="label gold">Olá${nome ? ", " + esc(nome) : ""}</div><h1>${p.servicos?.length && !svcAtual ? "Seu currículo está pronto" : "Seu currículo está andando"}</h1><p>${esc(subt)}</p>
      <p class="xs faint" style="margin-top:10px">Atualizado ${esc(dataHora(p.atualizadoEm))}</p></div>${anel(p.progresso || 0)}</section>

    ${pend.length ? `<section class="card"><div class="card-h"><h2>O que falta você enviar</h2><span class="pill gold">${pend.length}</span></div>
      ${pend.map(x => `<div class="pend"><span class="dot gold" style="margin-top:7px;flex:none"></span><div class="grow"><div style="font-weight:600">${esc(x.texto)}</div>${x.prazo ? `<div class="xs muted">até ${dBR(x.prazo)}</div>` : ""}</div><a class="btn sm" target="_blank" rel="noopener" href="${waLink(ct.whats, waTxt + "Sobre a pendência: " + x.texto)}">Avisar</a></div>`).join("")}
      ${feitas.length ? `<details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">${feitas.length} ${feitas.length > 1 ? "itens resolvidos" : "item resolvido"}</summary><div style="margin-top:8px">${feitas.map(x => `<div class="pend feita">${esc(x.texto)}</div>`).join("")}</div></details>` : ""}</section>` : ""}

    ${futuros.length ? `<section class="card"><div class="card-h"><h2>Próximas datas</h2></div><div class="list">${futuros.slice(0, 5).map(x => { const d = dias(x.d); return `<div class="li"><div class="countdown"><b class="num">${d}</b><span>${d === 1 ? "dia" : "dias"}</span></div><div class="grow"><div class="t">${esc(x.t)}</div><div class="small muted">${dBR(x.d)}</div></div></div>`; }).join("")}</div></section>` : ""}

    <section class="card"><div class="card-h"><h2>${(p.servicos || []).length > 1 ? "Seus serviços" : "Seu serviço"}</h2></div>
      ${(p.servicos || []).length ? `<div class="stack" style="gap:18px">${p.servicos.map(s => `<div><div class="row between" style="margin-bottom:10px"><b>${esc(s.nome)}</b>${s.etapa === ULT ? `<span class="pill ok">Entregue</span>` : ETAPAS[s.etapa].cli ? `<span class="pill gold">Depende de você</span>` : `<span class="pill">Com a MedEasy</span>`}</div>
        <div>${ETAPAS.map((e, j) => `<div class="pstep ${j < s.etapa || s.etapa === ULT ? "done" : j === s.etapa ? "cur" : "todo"}"><span class="b">${j < s.etapa || s.etapa === ULT ? "✓" : ""}</span><div><div class="tt">${e.t}</div>${j === s.etapa && s.etapa < ULT ? `<div class="small muted">${e.c}</div>` : ""}</div></div>`).join("")}</div></div>`).join(`<div class="hr"></div>`)}</div>` : `<div class="empty">O seu mentor está cadastrando os serviços</div>`}</section>

    ${(p.provas || []).map(pv => { const it = pv.itens || []; const temNota = pv.notaEstimada !== "" && pv.notaEstimada != null;
      return `<section class="card"><div class="card-h"><div><h2>${esc(pv.nome)} ${esc(pv.ano || "")}</h2>${pv.area ? `<div class="sub">${esc(pv.area)}</div>` : ""}</div>${pv.link ? `<a class="btn sm" href="${esc(pv.link)}" target="_blank" rel="noopener">Edital</a>` : ""}</div>
        ${temNota ? `<div class="row" style="gap:24px;align-items:flex-end"><div><div class="label">Nota estimada</div><div class="score">${d1(num(pv.notaEstimada))}<small> / ${d1(num(pv.notaMax) || 100)}</small></div></div>${num(pv.notaPossivel) > num(pv.notaEstimada) ? `<div><div class="label gold">Possível até o prazo</div><div class="score gold" style="font-size:30px">${d1(num(pv.notaPossivel))}</div></div>` : ""}</div>
          <div class="bar" style="margin-top:12px;height:8px;position:relative"><i style="width:${Math.min(100, num(pv.notaEstimada) / (num(pv.notaMax) || 100) * 100)}%"></i></div>` : `<p class="muted small" style="margin:0">A projeção da nota aparece aqui depois da análise curricular</p>`}
        ${pv.prazoEnvio || pv.dataProva ? `<div class="row small" style="margin-top:12px">${pv.prazoEnvio ? `<span class="pill gold">Envio até ${dBR(pv.prazoEnvio)}</span>` : ""}${pv.dataProva ? `<span class="pill info">Prova ${dBR(pv.dataProva)}</span>` : ""}</div>` : ""}
        ${pv.regras ? `<p class="small" style="margin:12px 0 0;color:var(--muted)">${esc(pv.regras)}</p>` : ""}
        ${it.length ? itensView(it) : ""}
      </section>`; }).join("")}

    ${(p.documentos || []).length ? `<section class="card"><div class="card-h"><h2>Seus documentos</h2></div><div class="list">${p.documentos.map(d => `<div class="li"><div class="grow"><div class="t">${esc(d.nome)}</div></div>${d.link ? `<a class="btn sm pri" href="${esc(d.link)}" target="_blank" rel="noopener">Abrir</a>` : ""}</div>`).join("")}</div></section>` : ""}

    ${(p.atualizacoes || []).length ? `<section class="card"><div class="card-h"><h2>Novidades</h2></div><div class="tl">${[...p.atualizacoes].reverse().slice(0, 12).map(a => `<div class="tl-i"><div class="xs muted">${esc(dataHora(a.em))}</div><div class="small">${esc(a.texto)}</div></div>`).join("")}</div></section>` : ""}

    ${f.total ? `<section class="card"><div class="card-h"><h2>Pagamento</h2>${f.saldo > 0 ? `<span class="pill gold">Saldo ${brl(f.saldo)}</span>` : `<span class="pill ok">Quitado</span>`}</div>
      <div class="row between small"><span>Total do serviço</span><b class="num">${brl(f.total)}</b></div><div class="row between small" style="margin-top:4px"><span>Pago</span><b class="num neon">${brl(f.pago)}</b></div>
      <div class="bar" style="margin-top:10px"><i style="width:${Math.min(100, f.pago / f.total * 100)}%"></i></div>
      <p class="xs muted" style="margin:10px 0 0">${f.entradaOk ? "Entrada recebida. O restante é pago quando você receber a versão para conferência." : `A entrada é de 50% (${brl(f.total / 2)}) e libera o começo da produção.`}</p>
      ${f.pix && f.saldo > 0 ? `<div class="code" style="margin-top:10px;font-family:var(--f-body);font-size:13px">${esc(f.pix)}</div>` : ""}</section>` : ""}

    <section class="card"><div class="card-h"><h2>Como funciona</h2></div>
      <details class="faq"><summary>Quanto tempo leva?</summary><p>A análise curricular sai em até 3 dias úteis. O Vitae e o Lattes, em até 7 dias úteis. Se precisar antes, fale com o mentor sobre a taxa de urgência.</p></details>
      <details class="faq"><summary>Como confiro o documento?</summary><p>Quando o serviço chegar na etapa de conferência, o link aparece em Seus documentos. Confira tudo e mande os ajustes pelo WhatsApp. Alterações depois de 2 dias do envio têm taxa adicional.</p></details>
      <details class="faq"><summary>Vocês enviam o currículo no site da prova?</summary><p>Não. Entregamos tudo pronto, do jeito que o edital pede, para você só anexar na inscrição.</p></details>
      <details class="faq"><summary>Posso mandar mais certificados depois?</summary><p>Pode. Avise o mentor. Certificados novos podem mudar a nota e o valor do serviço.</p></details>
      <details class="faq"><summary>Quem cuida dos certificados?</summary><p>A MedEasy organiza os certificados que você envia. Não produzimos certificados nem declarações, e a origem dos documentos é responsabilidade de quem envia.</p></details></section>

    <section class="card"><div class="row between"><div><div class="label">Seu mentor</div><b style="font-size:17px">${esc(ct.mentor)}</b><div class="small muted">${esc(ct.texto)} · ${esc(ct.email)}</div></div><a class="btn pri" target="_blank" rel="noopener" href="${waLink(ct.whats, waTxt)}">Chamar no WhatsApp</a></div></section>
    <p class="xs faint" style="text-align:center">MedEasy · @med_easyy · Goiânia, Goiás</p>
  </main>`;
}

function itensView(it){
  const sit = x => { const t = semAcento(x.situacao || ""); if (t.startsWith("completo")) return ["ok","Completo"]; if (t.startsWith("aumentar")) return ["gold","Dá para aumentar agora"]; if (t.startsWith("parcial")) return ["gold","Parcial"]; if (t.startsWith("medio")) return ["info","Médio prazo"]; if (t.startsWith("nao se aplica")) return ["","Não se aplica agora"]; return x.situacao ? ["", x.situacao] : (x.max && x.pontos >= x.max ? ["ok","Completo"] : ["",""]); };
  const completos = it.filter(x => x.max && x.pontos >= x.max).length;
  const chances = it.filter(x => x.ganho > 0 && /^(aumentar|parcial)/.test(semAcento(x.situacao || "aumentar"))).sort((a, b) => b.ganho - a.ganho).slice(0, 3);
  return `<div class="hr"></div>
   <div class="row between small"><span><b>${completos}</b> de ${it.length} itens completos</span>${chances.length ? `<span class="gold">Onde dá para ganhar mais agora</span>` : ""}</div>
   ${chances.length ? `<div class="stack" style="gap:6px;margin-top:8px">${chances.map(x => `<div class="pend" style="padding:8px 12px"><div class="grow small"><b>${esc(x.nome)}</b><div class="xs muted">${esc(x.regra || "")}</div></div><b class="num gold">+${d1(x.ganho)}</b></div>`).join("")}</div>` : ""}
   <div style="margin-top:12px">${it.map(x => { const [k, t] = sit(x); const tem = (x.comprovantes || []).length;
     return `<details class="faq"><summary style="list-style:none"><div class="itbar" style="border:0;padding:0"><div style="min-width:0"><div style="overflow-wrap:anywhere;font-weight:600">${esc(x.nome)}</div><div class="row" style="gap:6px;margin-top:4px">${t ? `<span class="pill ${k}">${esc(t)}</span>` : ""}${tem ? `<span class="xs muted">${tem} ${tem === 1 ? "comprovante" : "comprovantes"}</span>` : ""}</div><div class="bar ${x.max && x.pontos >= x.max ? "" : "gold"}" style="margin-top:6px"><i style="width:${x.max ? Math.min(100, x.pontos / x.max * 100) : 0}%"></i></div></div>
       <div class="num" style="text-align:right"><b>${d1(x.pontos)}</b><span class="muted"> / ${d1(x.max)}</span>${x.ganho ? `<div class="xs gold">+${d1(x.ganho)} possível</div>` : ""}</div></div></summary>
       <div class="small" style="margin-top:8px">${x.regra ? `<p class="muted" style="margin:0 0 8px">${esc(x.regra)}</p>` : ""}
        ${tem ? `<div class="label" style="margin-bottom:4px">O que você já tem</div><ol style="margin:0 0 8px;padding-left:20px">${x.comprovantes.map(c => `<li>${esc(c)}</li>`).join("")}</ol>` : `<p class="faint" style="margin:0 0 8px">Nenhum comprovante neste item ainda</p>`}
        ${x.comentario ? `<div class="label" style="margin-bottom:4px">Comentário do mentor</div><p style="margin:0">${esc(x.comentario)}</p>` : ""}</div></details>`; }).join("")}</div>`;
}

function render(){
  const sy = window.scrollY;
  if (S.modo === "login") app.innerHTML = loginView();
  else if (S.modo === "cliente") app.innerHTML = portalView(S.portal, false);
  else if (S.preview) app.innerHTML = portalView(espelho(S.eq.clientes.find(c => c.id === S.preview)), true);
  else app.innerHTML = mentorView();
  if (S.modo !== "login") window.scrollTo(0, sy);
  const f = $("#fLogin"); if (f){ f.onsubmit = e => { e.preventDefault(); if (S.aba === "cliente") entrarCliente($("#lCodigo").value); else entrarMentor($("#lNome").value, $("#lSenha").value); }; const first = f.querySelector("input"); if (first && !S.carregando) first.focus(); }
  const b = $("#busca"); if (b){ b.oninput = () => { S.busca = b.value; const pos = b.selectionStart; render(); const nb = $("#busca"); nb.focus(); nb.setSelectionRange(pos, pos); }; }
  const vm = $("#verMentor"); if (vm) vm.onchange = () => { S.verMentor = vm.value; render(); };
}
const A = {
  aba: el => { S.aba = el.dataset.v; S.erro = ""; render(); },
  sair: () => sair(),
  nav: el => { S.view = el.dataset.v; S.preview = null; render(); window.scrollTo(0, 0); },
  abrir: el => { S.sel = el.dataset.id; S.view = "cliente"; render(); window.scrollTo(0, 0); },
  filtro: el => { S.filtro = el.dataset.v; render(); },
  preview: () => { S.preview = S.sel; render(); window.scrollTo(0, 0); },
  sairPreview: () => { S.preview = null; render(); },
  copiarConvite: () => copiar(convite(S.eq.clientes.find(c => c.id === S.sel))),
};
app.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el || el.tagName === "A") return; const fn = A[el.dataset.a]; if (fn){ e.preventDefault(); fn(el); } });

(async () => {
  let s = null; try { s = JSON.parse(sessionStorage.getItem("medeasy")); } catch {}
  const cod = new URLSearchParams(location.search).get("c");
  if (s && s.tipo === "mentor") await entrarMentor(s.nome, s.segredo);
  else if (s && s.tipo === "cliente") await entrarCliente(s.segredo);
  else if (cod){ S.aba = "cliente"; await entrarCliente(cod); }
  else render();
  if (S.modo === "login") S.erro = "", render();
})();
</script>
</body>
</html>
