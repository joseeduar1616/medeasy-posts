<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Portal MedEasy</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: barra fixa com abas, conteúdo em grade de cartões; o portal do cliente é uma coluna única de leitura.
   Marca MedEasy: noite verde-escura, verde neon da logo e o dourado da lâmpada. Tema escuro único, por escolha da marca. */
:root{
  --bg:#0A0F0C; --surface:#111914; --surface2:#17221B; --line:#243129; --line2:#2F3F35;
  --fg:#E8F0EA; --muted:#8EA196; --faint:#5E7066;
  --neon:#3DFF6E; --neon-ink:#06210F; --neon-soft:rgba(61,255,110,.12);
  --gold:#F0BE4E; --gold-soft:rgba(240,190,78,.13);
  --warn:#FFA94D; --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.12); --info:#7CC4FF;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px; --r-sm:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--neon)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .gold{color:var(--gold)} .neon{color:var(--neon)}
.small{font-size:13px} .xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{width:34px;height:auto;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--neon)}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;margin-left:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.tab:hover{color:var(--fg);background:var(--surface2)}
.tab[aria-current="page"]{background:var(--neon);color:var(--neon-ink)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--neon)}
.sync[data-s="salvando"]::before{background:var(--gold)}
.sync[data-s="erro"]::before{background:var(--bad)}
@media (max-width:720px){.top-in{flex-wrap:wrap;gap:10px}.brand{flex:1;min-width:0}.brand span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#verMentor{max-width:140px}.tabs{order:3;flex-basis:100%;margin-left:0}.sync{margin-left:auto}}

main{padding-block:22px 60px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:clamp(24px,3.4vw,32px);font-weight:800}
.pagehead p{margin:4px 0 0;color:var(--muted)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-size:18px;font-weight:700}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:13px;color:var(--muted)}
.sec{scroll-margin-top:90px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{border-color:color-mix(in srgb,var(--neon) 45%,var(--line));background:linear-gradient(160deg,var(--neon-soft),var(--surface) 60%)}
.kpi.hl .v{color:var(--neon)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--neon);border-color:var(--neon);color:var(--neon-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241800}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.on{background:var(--bad);color:#2a0606}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:5px 9px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}

/* Fields */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12px;color:var(--muted);font-weight:600}
.in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.in:focus{border-color:var(--neon);outline:none;box-shadow:0 0 0 3px var(--neon-soft)}
textarea.in{resize:vertical;min-height:80px;line-height:1.45}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.chk input{accent-color:var(--neon);width:16px;height:16px}
.search{max-width:320px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--neon);border-color:color-mix(in srgb,var(--neon) 40%,transparent);background:var(--neon-soft)}
.pill.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}
.dot.ok{background:var(--neon)} .dot.gold{background:var(--gold)} .dot.bad{background:var(--bad)}

/* Progress */
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--neon);border-radius:99px}
.bar.gold > i{background:var(--gold)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow,.pend .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.clickable{cursor:pointer;border-radius:8px}
.clickable:hover .t{color:var(--neon)}
.sev{width:4px;align-self:stretch;border-radius:4px;background:var(--line2);flex:none}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.gold{background:var(--gold)} .sev.ok{background:var(--neon)} .sev.info{background:var(--info)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}

/* Client rows */
.crow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer}
.crow:hover{background:var(--surface2)}
.crow:first-child{border-top:0}
.crow .t{font-weight:700}
@media (max-width:820px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .hide-m{display:none}}

/* Stepper */
.steps{display:flex;gap:4px;margin-top:10px}
.steps button{flex:1;height:8px;border-radius:99px;border:0;background:var(--line2);cursor:pointer;padding:0}
.steps button.done{background:color-mix(in srgb,var(--neon) 55%,var(--line2))}
.steps button.cur{background:var(--neon);box-shadow:0 0 10px var(--neon-soft)}
.steps.ro button{cursor:default}
.svc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}

/* Kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;font-weight:700;font-size:13px}
.kcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.kcard .t{font-weight:700;cursor:pointer}
.kcard .t:hover{color:var(--neon)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl .in{padding:6px 8px}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{fill:color-mix(in srgb,var(--neon) 70%,var(--surface))}
.chart .b.now{fill:var(--neon)}
.chart .vl{fill:var(--fg);font-weight:600}

.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .fr{display:grid;grid-template-columns:150px 1fr 32px;gap:10px;align-items:center;font-size:13px}
@media (max-width:480px){.funnel .fr{grid-template-columns:110px 1fr 28px}}

/* Orçamento preview, inspired by the printed budget */
.paper{background:#FFF9F5;color:#1d1d1d;border-radius:10px;padding:20px;font-size:13px}
.paper h3{font-family:var(--f-body);font-weight:800;font-size:16px;color:#111}
.paper .ps{color:#004172;font-weight:700;font-size:12px;margin-top:2px}
.paper table{width:100%;border-collapse:collapse;margin-top:12px}
.paper th{background:#004172;color:#fff;font-size:11px;padding:7px;text-align:left}
.paper td{border-bottom:1px solid #e5d9d0;padding:7px;vertical-align:top}
.paper .tot{text-align:right;font-weight:800;font-size:15px;margin-top:10px;color:#111}
.paper .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:2px solid #004172;padding-bottom:6px;margin-top:10px;color:#004172;font-weight:700;font-size:12px}
.opt-tabs{display:flex;gap:6px;flex-wrap:wrap}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

/* Waiting banner */
.wait{border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}

/* ---------- Portal do cliente ---------- */
.portal{max-width:760px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,rgba(240,190,78,.16),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(61,255,110,.12),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:clamp(26px,5vw,36px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted)}
.ring{width:118px;height:118px;flex:none}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--fg)}
@media (max-width:520px){.hero{grid-template-columns:1fr}.ring{width:96px;height:96px}}
.pstep{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:12px}
.pstep:last-child{padding-bottom:0}
.pstep::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.pstep:last-child::before{display:none}
.pstep .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:800;position:relative;z-index:1}
.pstep.done .b{background:var(--neon);border-color:var(--neon);color:var(--neon-ink)}
.pstep.cur .b{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.pstep.cur .b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pstep .tt{font-weight:600;font-size:14px}
.pstep.todo .tt{color:var(--faint)}
.score{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:16px;color:var(--muted);font-weight:600}
.itbar{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.itbar:first-child{border-top:0}
.itbar .bar{margin-top:5px}
.countdown{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line2)}
.countdown b{font-family:var(--f-display);font-size:22px;line-height:1}
.countdown span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0}
.tl-i{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl-i:first-child{border-top:0}
.pend{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.pend + .pend{margin-top:8px}
.pend.feita{background:none;border-color:var(--line);color:var(--muted);text-decoration:line-through}
details.faq{border-top:1px solid var(--line);padding:10px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:8px 0 0;color:var(--muted)}
.preview-bar{background:var(--gold);color:#241800;font-weight:700}
.preview-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}

/* Gate screens */
.gate{min-height:80vh;display:grid;place-items:center;text-align:center}
.gate .box{max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px}
.gate img{width:120px}
.code{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px dashed var(--line2);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--neon);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
.hr{height:1px;background:var(--line);margin:14px 0}
.drop{position:relative}
.drop-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;z-index:4;overflow:hidden}
.drop-list button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer}
.drop-list button:hover{background:var(--line)}
.drop-list img{width:24px;height:24px;border-radius:50%}
.av{width:28px;height:28px;border-radius:50%;flex:none}
.stars{display:inline-flex;gap:2px}.stars button{background:none;border:0;padding:2px 3px;font-size:30px;line-height:1;color:var(--line);cursor:pointer;font-family:inherit}.stars button.on{color:var(--gold)}.stars button:focus-visible{outline:2px solid var(--neon);border-radius:6px}
.nova-versao{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--neon);border-radius:var(--r);padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:14px;max-width:calc(100% - 32px)}
.ci-passo{display:inline-flex;align-items:center;gap:2px}.ci-passo .btn{padding:4px 9px;font-size:16px;line-height:1}

.login{max-width:400px;width:100%;text-align:left}
.login h1{font-size:30px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:8px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--neon);color:var(--neon-ink)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;background:var(--bg)}
.chk:has(input:checked){border-color:var(--neon);color:var(--neon);background:var(--neon-soft)}
.chk input{accent-color:var(--neon);margin:0}
.tbl.ct td{padding:4px 6px;vertical-align:top} .tbl.ct .in{padding:5px 8px;font-size:13px}
.preco{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.preco > div:first-child{flex:1;min-width:0}
.preco .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;flex:none;max-width:45%}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="gate"><div class="box"><div class="spin"></div></div></div></div></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
if (/\/portal$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search);
const LOGO = "logo.webp";
const CONTATO = { whats:"5562995155830", texto:"(62) 99515-5830", email:"medeasyy0@gmail.com", mentor:"Eduardo" };
const ETAPAS = [

/* Orçamento pela contagem (mesmas regras do build e da skill de orçamento) */
function estimarJS(c){

  const temLattes = tipos.includes("lattes"), temCert = tipos.includes("certificados");
  const lattesB = temLattes && temCert && !tipos.includes("vitae");
  const temVitae = tipos.includes("vitae") || (temCert && !lattesB), temAnalise = tipos.includes("analise") || lattesB;
  const provas = (c.provas || []).filter(p => p.nome); const taxa = provas.length > 2 ? PRECO.taxaMaisDeDuas : PRECO.taxa;
  let maxCert = c.nCert ?? null;
  for (const p of provas){
    const cp = calcDe(c, p); let n = c.nCert, a = c.nArtigos || 0, fonte = c.nCert != null ? "Notion" : "";

    let fora = 0;
    if (cp.tem){ n = cp.nCertVal; a = cp.nArtVal; fora = cp.nCert + cp.nArt - n - a; fonte = "contagem"; maxCert = Math.max(maxCert ?? 0, n + a); }
    const m = modeloDe(p.nome);
    if (temVitae || (!temAnalise && !lattesB)){
      const desc = `${p.nome}: análise curricular + seleção dos certificados (Modelo ${m} Vitae)`;
      if (n == null){ falta = true; linhas.push({ desc, conta:"falta o número de certificados", valor:null }); continue; }
      const u = PRECO.vitae[m][faixaQ(n)];
      linhas.push({ desc, conta:`${br2(taxa)} + ${n} X ${br2(u)}${a ? ` + ${a} X ${br2(PRECO.artigo)}` : ""}`, valor:taxa + n * u + a * PRECO.artigo, fonte, fora });
    } else linhas.push({ desc:`${p.nome}: análise curricular`, conta:"1", valor:provas.length >= 2 ? PRECO.analise2 : PRECO.analise1 });
  }
  if (!provas.length && temVitae){
    if (c.nCert == null){ falta = true; linhas.push({ desc:"Currículo Vitae/currículo com certificados comprovados", conta:"falta o número de certificados", valor:null }); }
    else { const u = PRECO.vitae.A[faixaQ(c.nCert)], a = c.nArtigos || 0; linhas.push({ desc:"Currículo Vitae/currículo com certificados comprovados (Modelo A)", conta:`${br2(PRECO.taxa)} + ${c.nCert} X ${br2(u)}${a ? ` + ${a} X ${br2(PRECO.artigo)}` : ""}`, valor:PRECO.taxa + c.nCert * u + a * PRECO.artigo, fonte:"Notion" }); }

    else { const u = PRECO.lattes[cat][faixaQ(maxCert)]; linhas.push({ desc, conta:`${maxCert} X ${br2(u)}`, valor:maxCert * u }); }

const NUM_F = "\\d+(?:,\\d+)?";

// Código do item ("1", "1.1", "3a", "E1") e palavras do título, para casar com as linhas do currículo
const codigoF = item => (String(item).match(/^\s*([0-9]{1,2}(?:\.[0-9]{1,2})?[a-z]?|[A-Z][0-9]?)[.)]?\s/) || [])[1] || "";

const ordinalF = l => (String(l).match(/^\s*(\d{1,2})\s*[º°ª](?![0-9])/) || [])[1] || "";

  for (const l of linhas) {

const ALIAS_PROVA = { psu:"psugo", psugo:"psugo", sesgo:"sesgo", psumg:"psumg", usp:"uspsp", usprp:"usprp", ribeirao:"usprp", santacasa:"santacasasp", scmsp:"santacasasp", sirio:"siriolibanes", dante:"dante", puc:"puccamp", cet:"cet", fubog:"fubog", olhos:"fubog" };
function interpretarPedido(texto){
  const t = semAcento(texto); const k = kP(texto); const motivos = [];

  const temLattes = /lattes/.test(t), temVitae = /vitae|curriculo|documento|montar|organiza/.test(t), soAnalise = /\b(so|apenas|somente)\b[^.]*analise|analise[^.]*\b(so|apenas|somente)\b|so quero saber|projecao|quanto (eu )?(faria|faco|pontuo)|quantos pontos/.test(t);
  if (temLattes && /comprova|documento/.test(t) && !temVitae) { servico = "lattesb"; motivos.push("citou Lattes com documento de comprovação"); }
  else if (temLattes) { servico = "lattes"; motivos.push("citou o Lattes"); }
  else if (soAnalise && !temVitae) { servico = "analise"; motivos.push("pediu só a análise ou a projeção da nota"); }
  else if (temVitae) motivos.push("citou currículo ou documento");
  else motivos.push("não citou o serviço, ficou o padrão Vitae + análise");
  const mentoria = /mentoria/.test(t) ? (/individual|avuls|uma (so )?vez|pontual/.test(t) ? "individual" : "mensal") : "";
  if (mentoria) motivos.push("citou mentoria" + (mentoria === "individual" ? " individual" : ""));
  const provas = new Set();
  for (const p of PROVAS){ if (k.includes(p.k) || k.includes(kP(p.nome))) provas.add(p.k); }
  const palavras = t.split(/[^a-z]+/);
  for (const [a, pk] of Object.entries(ALIAS_PROVA)){ if (palavras.includes(a) || (a.length > 4 && k.includes(a))) provas.add(pk); }

  if (provas.has("psugo") && /psu\s?-?\s?mg/.test(t) && !/psu\s?-?\s?go|psugo/.test(t)) provas.delete("psugo");

  if (provas.has("usprp") && !/usp\s?-?\s?sp|uspsp|sao paulo/.test(t)) provas.delete("uspsp");
  if (/urgen|essa semana|amanha|hoje/.test(t)) motivos.push("parece ter pressa");
  return { servico, mentoria, provas:[...provas].filter(x => PROVAS.some(p => p.k === x)), motivos };
}

  if (campo === "prova"){ const set = new Set(t.provas || []); el.checked ? set.add(el.value) : set.delete(el.value); t.provas = PROVAS.map(p => p.k).filter(k => set.has(k)); }
  else if (el.type === "checkbox") t[campo] = el.checked; else t[campo] = el.value;
  if (S.modo === "triagem") return;
  salvarTri(t); delete S.cont[t.id];
  if (campo === "prova" || campo === "servico" || campo === "drive" || campo === "mentoria" || campo === "mentoriaInd") render();
  // Campos digitados (desconto, certificados, valor da mentoria): redesenhar a tela inteira tirava o foco do campo a cada número,
  // e "10" virava "1". Agora só os cartões de provas, orçamento e fechamento são refeitos.
  else if (campo === "nCert" || campo === "desconto" || campo === "reunioes") atualizarTriParcial();
}

async function importarOrcEnviado(input){
  const c = clienteSel(); const f = input.files && input.files[0]; input.value = ""; if (!c || !f) return;
  try { const { ops, foto } = await lerOrcArquivo(f); const ct = ctrlDe(c);
    // A opção fechada: a que bate com o Valor total do Notion, ou a única
    const total = (c.servicos || []).reduce((a, s) => a + (s.mensal ? 0 : num(s.total)), 0);
    const bate = ops.find(o => Math.abs(o.total - total) < 0.01);
    ct.orcamento = { arquivo:f.name, em:Date.now(), foto, opcoes:opcoesCurtas(ops), escolhida:bate ? bate.letra : ops.length === 1 ? ops[0].letra : "" };

/* Lê a resposta do Claude. Só preenche os campos que achar. Aceita negrito, títulos e "8/10" ou "8 de 10". */
function lerNotaTexto(txt, c){
  const limpo = String(txt || "").replace(/\r/g, "").replace(/\*\*|__|`/g, "").replace(/^\s*#+\s*/gm, "");
  let blocos = limpo.split(/^\s*NOTA MEDEASY\s*:?\s*$/im).slice(1); if (!blocos.length) blocos = [limpo];
  const provas = (c.provas || []).filter(p => p.nome); const out = [];
  const ROT = /^(prova|nota|nota atual|possivel|nota possivel|maximo|nota maxima|certificados|certificados validos|artigos?|recado|pendencias)\s*:/;
  const numDe = s => (String(s || "").match(/\d+(?:[.,]\d+)?/) || [])[0];
  for (const b of blocos){
    const ls = b.split("\n"); const rot = l => (semAcento(l).trim().match(ROT) || [])[1] || "";
    const campo = (...nomes) => { const l = ls.find(l => nomes.includes(rot(l))); return l == null ? null : l.slice(l.indexOf(":") + 1).trim(); };
    const provaTxt = campo("prova"); const kp = provaTxt ? kP(provaTxt.replace(/\s*20\d\d.*$/, "")) : "";
    const p = kp ? provas.find(x => kp.startsWith(kP(x.nome)) || kP(x.nome).startsWith(kp)) : provas.length === 1 ? provas[0] : null;
    if (!p) continue;
    const r = {}; const nota = campo("nota", "nota atual");
    if (nota != null){ const m = nota.match(/(\d+(?:[.,]\d+)?)\s*(?:de|\/|em)\s*(\d+(?:[.,]\d+)?)/i); if (m){ r.nota = m[1]; r.max = m[2]; } else if (numDe(nota)) r.nota = numDe(nota); }
    const mx = campo("maximo", "nota maxima"); if (numDe(mx)) r.max = numDe(mx);
    const pos = campo("possivel", "nota possivel"); if (numDe(pos)) r.possivel = numDe(pos);
    // Recado: da linha "Recado:" até o próximo rótulo. Pendências: as linhas depois de "Pendências:".
    const iR = ls.findIndex(l => rot(l) === "recado");
    if (iR >= 0){ const partes = [ls[iR].slice(ls[iR].indexOf(":") + 1)]; for (const l of ls.slice(iR + 1)){ if (rot(l)) break; partes.push(l); } const t = partes.join(" ").replace(/\s+/g, " ").trim(); if (t) r.recado = t; }

    if (iP >= 0){ const linhas = [ls[iP].slice(ls[iP].indexOf(":") + 1), ...ls.slice(iP + 1)]; const pend = [];

      r.pend = pend.join("\n"); }
    if (Object.keys(r).length) out.push({ p, r });
  }
  return out;
}

  let texto = ""; try { texto = await textoDoPdf(f); } catch { return [certDoTexto("", f.name)]; }
  const paginas = texto.split("\f").map(s => s.trim()); const comCert = paginas.filter(p => /certific|declara|atesta/i.test(p));
  if (paginas.length > 1 && paginas.length <= 60 && comCert.length >= Math.max(2, paginas.length * 0.6)) return paginas.map((p, i) => certDoTexto(p, `${f.name} p.${i + 1}`)).filter(x => x.desc);
  return [certDoTexto(texto, f.name)];
}
/* Certificados pelo Gemini: um por arquivo, ou um por página quando o arquivo junta vários. Só descreve, não decide o item do edital. */
const esqCert = () => ({ type:"OBJECT", required:["certificados"], properties:{ certificados:{ type:"ARRAY", items:{ type:"OBJECT", required:["arquivo", "desc", "tipo"], properties:{ arquivo:{ type:"INTEGER" }, pagina:{ type:"INTEGER" }, desc:ESQ_TXT, tipo:{ type:"STRING", enum:TIPOS_CERT }, ano:ESQ_TXT, ch:ESQ_TXT, obs:ESQ_TXT } } } } });
async function certsComGemini(docs){
  const out = [];
  for (let i = 0; i < docs.length; i += 8){ const lote = docs.slice(i, i + 8);
    const j = await geminiLer(lote, `Cada arquivo anexado traz um ou mais certificados ou declarações de um estudante de medicina, às vezes um por página. Para cada certificado devolva: o número do arquivo na lista, a página (quando o arquivo tiver mais de um certificado), uma descrição curta da atividade e do papel (por exemplo "Monitoria de Anatomia" ou "Ouvinte no Congresso Brasileiro de Cardiologia"), o tipo (um da lista), o ano (o mais recente que aparece) e a carga horária em horas (só o número, vazio se não tiver). Use obs só quando algo estiver ilegível ou faltando. Não invente: o que não der para ler fica vazio. Página que não é certificado (capa, verso, QR code) não entra.`, esqCert(), { rapido:true, aviso:"Lendo os certificados com o Gemini" });
    const lista = (j.certificados || []).filter(x => x && lote[x.arquivo - 1]);
    lote.forEach((f, k) => { const deste = lista.filter(x => x.arquivo === k + 1); const varios = deste.length > 1;
      if (!deste.length) out.push({ ...certDoTexto("", f.name), obs:"O Gemini não achou certificado neste arquivo, conferir" });
      deste.forEach((x, n) => out.push({ id:novoIdC(), desc:String(x.desc || "").trim().slice(0, 140) || f.name, tipo:TIPOS_CERT.includes(x.tipo) ? x.tipo : "Outro", ano:String(x.ano || "").replace(/\D/g, "").slice(0, 4), ch:String(x.ch || "").replace(/[^\d]/g, "").slice(0, 4), obs:String(x.obs || "").trim(), arquivo:varios ? `${f.name} p.${x.pagina || n + 1}` : f.name })); });
  }
  return out;
}

function calcMarc(p, m){
  const itens = itensDaProva(p); const reg = {}, regMeta = {};
  for (const it of itens){ const x = (m || {})[it.key]; if (!x) continue;
    const n = it.unit != null ? Math.max(0, Math.floor(num(x.n))) : 0; const pts = it.unit == null && x.st === "tenho" ? (x.pts === "" || x.pts == null ? it.maxN : num(x.pts)) : "";
    if (x.st === "tenho"){ reg[it.key] = { n, pts }; regMeta[it.key] = { n, pts }; }
    else if (x.st === "andamento"){ regMeta[it.key] = { n:Math.max(1, n), pts:it.unit == null ? it.maxN : "" }; } }
  const atual = calcProva(itens, reg, tetoDe(p)), meta = calcProva(itens, regMeta, tetoDe(p));
  const faltam = atual.rows.map((x, i) => { const st = ((m || {})[x.key] || {}).st || "nao"; const mx = x.grupo && x.grupoMax != null ? Math.min(x.maxN, x.grupoMax) : x.maxN; return { x, st, falta:r2(mx - x.pts) }; }).filter(f => f.falta > 0.001 && f.st !== "na").sort((a, b) => b.falta - a.falta);

function dividirPags(svs, pags){

  for (const p of pags) if (p.servico && p.servico in m) m[p.servico] += num(p.valor);
  let solto = pags.filter(p => !(p.servico && p.servico in m)).reduce((a, p) => a + num(p.valor), 0);

/* ---------- Gemini pela ponte: lê orçamento, certificados, currículo e edital, e faz a nota ----------

let geminiOk = null;
async function temGemini(){

const tipoArquivo = f => f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : /\.png$/i.test(f.name) ? "image/png" : /\.webp$/i.test(f.name) ? "image/webp" : /\.hei[cf]$/i.test(f.name) ? "image/heic" : "image/jpeg");
async function geminiSobe(f){
  const h = { "Content-Type":tipoArquivo(f), Authorization:"Bearer " + S.senha, "X-Quem":encodeURIComponent(S.mentor?.nome || ""), "X-Nome":encodeURIComponent(f.name) };
  const r = await fetch(PONTE.replace(/\/$/, "") + "/gemini/arquivo", { method:"POST", headers:h, body:f });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.erro || ("erro " + r.status)); return j;

/* Manda os arquivos e o pedido. Word vira texto dentro do pedido (o Gemini não abre .docx). Com esquema, devolve o JSON. */
async function geminiLer(arquivos, pedido, esquema, { rapido = false, aviso = "Lendo com o Gemini" } = {}){
  const docs = arquivos.filter(f => /\.docx$/i.test(f.name)); const outros = arquivos.filter(f => !docs.includes(f));
  let texto = pedido;
  if (outros.length) texto += `\n\nArquivos anexados, nesta ordem: ${outros.map((f, i) => `${i + 1}. ${f.name}`).join("; ")}.`;
  for (const d of docs) texto += `\n\nConteúdo do arquivo ${d.name}:\n` + (await textoDoDocx(d)).slice(0, 150000);
  if (outros.length) toast(`${aviso}: enviando ${outros.length} ${outros.length === 1 ? "arquivo" : "arquivos"}`);
  const sub = []; for (let i = 0; i < outros.length; i += 4) sub.push(...await Promise.all(outros.slice(i, i + 4).map(geminiSobe)));
  for (const a of sub){ let n = 0; while (a.estado === "PROCESSING" && n++ < 45){ await new Promise(r => setTimeout(r, 2000)); a.estado = (await pontePedido("/gemini/estado", { nome:a.nome })).estado; }
    if (a.estado === "FAILED") throw new Error("o Gemini não conseguiu abrir um dos arquivos"); }
  toast(`${aviso}. Pode levar até 1 minuto`);
  // Aviso a cada 10 segundos enquanto espera, para ninguém achar que travou
  const t0 = Date.now(); const tick = setInterval(() => toast(`${aviso}: ${Math.round((Date.now() - t0) / 1000)} segundos`), 10000);
  let j; try { j = await pontePedido("/gemini/gerar", { texto, arquivos:sub.map(a => ({ uri:a.uri, tipo:a.tipo })), esquema, rapido }); } finally { clearInterval(tick); }
  if (!esquema) return j.texto;
  try { return JSON.parse(String(j.texto).replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, "")); } catch { throw new Error("o Gemini respondeu fora do formato"); }
}

/* Página ?feedback (ou o botão no portal do cliente). Duas partes, as duas opcionais:

app.addEventListener("change", e => { if (!e.target.dataset) return; if (e.target.dataset.ci === "cheio") { ciInput(e.target); return; } if (e.target.dataset.orcpdf) { importarOrcPdf(e.target); return; } if (e.target.dataset.notagem) { notaGemini(e.target); return; } if (e.target.dataset.orcenv) { importarOrcEnviado(e.target); return; } if (e.target.dataset.ns || e.target.dataset.nsp) { novoSvcMudou(e.target); return; } if (e.target.dataset.orcesc) { const c = clienteSel(); const ct = ctrlDe(c); if (ct.orcamento){ ct.orcamento.escolhida = e.target.dataset.orcesc; gravarOrcEnviado(c, "Opção fechada salva no Notion"); } return; } if (e.target.dataset.an) importarAnalise(e.target); else if (e.target.dataset.ctimp) importarCtrl(e.target); else if (e.target.dataset.tri === "outras" && S.modo !== "triagem") render(); else if (e.target.dataset.orc) orcInput(e.target); else if (e.target.dataset.cliarq) importarCertsCli(e.target); else if (e.target.dataset.anprova) escolherProvaAnalise(e.target); else if (e.target.dataset.edital) lerEditalArquivo(e.target); else if (e.target.dataset.curr) lerCurriculoArquivo(e.target); });

/* Versão nova do site: quem deixa a aba aberta continuava com o código antigo depois de uma correção.
   O montar-site grava a versão em site.txt. Ao voltar para a aba (e a cada 5 minutos) o site confere e oferece atualizar. */
const VERSAO_SITE = "cc8ca655b305";
/* Erro no site aparece na tela (com a versão), em vez de falhar calado. Ajuda a mandar print para o suporte. */
window.addEventListener("error", e => { try { toast(`Erro no site: ${e.message} (versão ${VERSAO_SITE})`); } catch {} });
window.addEventListener("unhandledrejection", e => { try { toast(`Erro no site: ${(e.reason && e.reason.message) || e.reason} (versão ${VERSAO_SITE})`); } catch {} });
async function conferirVersao(){
  if (document.getElementById("novaVersao")) return;
  try { const r = await fetch("site.txt?t=" + Date.now(), { cache:"no-store" }); if (!r.ok) return; const v = (await r.text()).trim();
    if (!v || v === VERSAO_SITE) return;
    const d = document.createElement("div"); d.id = "novaVersao"; d.className = "nova-versao";
    d.innerHTML = `<span>Saiu uma versão nova do site.</span><button class="btn sm pri" type="button">Atualizar agora</button>`;
    d.querySelector("button").onclick = () => location.reload(); document.body.appendChild(d); } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) conferirVersao(); });
setInterval(conferirVersao, 5 * 60 * 1000);
(async () => {
  let s = null; try { s = JSON.parse(sessionStorage.getItem("medeasy")); } catch {}
  const cod = new URLSearchParams(location.search).get("c");
  const tri = new URLSearchParams(location.search).get("triagem");
  if (tri !== null){ S.modo = "triagem"; S.triDestino = soDigitos(tri); render(); return; }
  // Depoimentos aprovados: página pública
  if (new URLSearchParams(location.search).has("depoimentos")){ S.modo = "depoimentos"; render(); carregarDepoimentos(); return; }
  // Página de feedback do cliente: ?feedback (pede o código) ou ?c=CODIGO&feedback (link do mentor)
  if (new URLSearchParams(location.search).has("feedback")){ S.querFeedback = true;
    if (cod) { await entrarCliente(cod); if (S.modo !== "feedback") { S.modo = "feedback"; render(); } return; }
    if (s && s.tipo === "cliente") { await entrarCliente(s.segredo); if (S.modo === "feedback") return; }
    S.modo = "feedback"; S.erro = ""; render(); return; }
  // Link "Abrir no painel" da mensagem de triagem: importa depois que o mentor entrar
  const imp = new URLSearchParams(location.search).get("i");
  if (imp){ S.importar = imp; S.aba = "mentor"; history.replaceState(null, "", location.pathname); }
  // Link "Abrir no painel" da marcação do cliente
  const marc = new URLSearchParams(location.search).get("m");
  if (marc){ S.importarMarc = marc; S.aba = "mentor"; history.replaceState(null, "", location.pathname); }
  // Link da lista de certificados que o cliente montou no portal
  const certs = new URLSearchParams(location.search).get("k");
  if (certs){ S.importarCerts = certs; S.aba = "mentor"; history.replaceState(null, "", location.pathname); }
  if (s && s.tipo === "mentor") await entrarMentor(s.nome, s.segredo);
  else if (s && s.tipo === "cliente") await entrarCliente(s.segredo);
  else if (cod){ S.aba = "cliente"; await entrarCliente(cod); }
  else render();
  if (S.modo === "login") S.erro = "", render();
})();
</script>
